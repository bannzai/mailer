name: Mailer
options:
  bundleIdPrefix: com.bannzai
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
packages:
  MailerPackage:
    path: .
  # swift-tools-version 6.2 を要求するため、Swift 6.0 の CI (swift build) が触る Package.swift ではなく
  # アプリターゲット側の依存として持つ。
  LicenseList:
    url: https://github.com/cybozu/LicenseList
    exactVersion: 2.5.0
targets:
  MailerApp:
    type: application
    platform: iOS
    sources:
      - Apps/Mailer
    dependencies:
      - package: MailerPackage
        product: MailerCore
      - package: LicenseList
        product: LicenseList
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bannzai.mailer
        PRODUCT_NAME: Mailer
        SWIFT_VERSION: "6.0"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Mailer
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
  MailerMac:
    type: application
    platform: macOS
    sources:
      - Apps/Mailer
    dependencies:
      - package: MailerPackage
        product: MailerCore
      - package: LicenseList
        product: LicenseList
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bannzai.mailer.mac
        PRODUCT_NAME: Mailer
        SWIFT_VERSION: "6.0"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Mailer
        CODE_SIGN_IDENTITY: "-"
